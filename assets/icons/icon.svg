<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo do App -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e2235" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>

    <!-- Gradiente Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Gradiente Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gradiente Neon Orange/Gold -->
    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Filtro de Brilho Neon (Glow Effect) -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do ícone (Borda Arredondada Estilo App Móvel) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Borda do ícone com brilho sutil -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#neon-cyan)" stroke-width="6" opacity="0.4" />
  
  <g transform="translate(256, 260) scale(1.05)" filter="url(#neon-glow)">
    <!-- Bloco Isometrico 1: Esquerda Inferior (Cian) -->
    <g transform="translate(-70, 40)">
      <!-- Face Superior (Top) -->
      <polygon points="0,-40 69,-80 138,-40 69,0" fill="#38bdf8" opacity="0.9" />
      <!-- Face Esquerda (Left) -->
      <polygon points="0,-40 69,0 69,80 0,40" fill="#0284c7" />
      <!-- Face Direita (Right) -->
      <polygon points="69,0 138,-40 138,40 69,80" fill="#0369a1" />
      <!-- Linhas internas/detalhes -->
      <polygon points="0,-40 69,-80 138,-40 69,0" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" />
    </g>

    <!-- Bloco Isometrico 2: Topo Central (Rosa) -->
    <g transform="translate(0, -80)">
      <!-- Face Superior (Top) -->
      <polygon points="0,-40 69,-80 138,-40 69,0" fill="#f43f5e" opacity="0.9" />
      <!-- Face Esquerda (Left) -->
      <polygon points="0,-40 69,0 69,80 0,40" fill="#be123c" />
      <!-- Face Direita (Right) -->
      <polygon points="69,0 138,-40 138,40 69,80" fill="#9f1239" />
      <!-- Linhas internas/detalhes -->
      <polygon points="0,-40 69,-80 138,-40 69,0" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" />
    </g>

    <!-- Bloco Isometrico 3: Direita Inferior (Amarelo/Laranja) -->
    <g transform="translate(70, 40)">
      <!-- Face Superior (Top) -->
      <polygon points="0,-40 69,-80 138,-40 69,0" fill="url(#neon-gold)" opacity="0.95" />
      <!-- Face Esquerda (Left) -->
      <polygon points="0,-40 69,0 69,80 0,40" fill="#ca8a04" />
      <!-- Face Direita (Right) -->
      <polygon points="69,0 138,-40 138,40 69,80" fill="#a16207" />
      <!-- Linhas internas/detalhes -->
      <polygon points="0,-40 69,-80 138,-40 69,0" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" />
    </g>
  </g>

  <!-- Brilho no topo -->
  <ellipse cx="256" cy="40" rx="140" ry="12" fill="#fff" opacity="0.08" filter="blur(6px)" />
</svg>
